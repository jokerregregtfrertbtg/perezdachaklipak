name: CI Check

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install flake8 black

      - name: Lint with flake8
        run: flake8 . --max-line-length=120

      - name: Check formatting with black
        run: black --check .

      - name: Run script
        run: python main.py

      - name: Debug secrets (masked)
        run: |
          echo "Token exists: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "Chat ID exists: ${{ secrets.TELEGRAM_CHAT_ID != '' }}"

      - name: Send Telegram success
        if: success()
        run: |
          curl -v -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text=" CI PASSED%0A${{ github.repository }}%0A${{ github.ref_name }}"

      - name: Send Telegram failure
        if: failure()
        run: |
          curl -v -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text=" CI FAILED%0A${{ github.repository }}%0A${{ github.ref_name }}"
